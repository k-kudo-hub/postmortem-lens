name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: python3 -m unittest discover -s scripts
      - run: npm run build

  # PR で足した・変えた障害だけ、一次報告の本文を取得して引用を突き合わせる。
  # 本文はジョブの中の一時ディレクトリに置くだけで、リポジトリにはコミットしない。
  verify-quotes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # PDF の一次報告をテキストにする pdftotext を入れる
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - run: python3 scripts/verify-changed-quotes.py "origin/${{ github.base_ref }}"
